<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공인중개사 문제풀이</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>공인중개사 문제풀이</h1>

    <div id="year-select"></div>
    <div id="subject-select"></div>
    <div id="question-box"></div>

    <div id="buttons" style="display:none;">
      <button id="back-to-main">메인으로 가기</button>
      <button id="show-answers">오답노트 보기</button>
    </div>

    <div id="nav-buttons" style="display:none;">
      <button id="prev-question">이전 문제</button>
      <button id="next-question">다음 문제</button>
    </div>

    <div id="all-answers"></div>
  </div>

  <script src="script_v3.js"></script>
</body>
</html>
